<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa das Ofertas — Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #7B1FA2, #9C27B0, #BA68C8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 20px rgba(123, 31, 162, 0.25);
        }
        .logo-section { text-align: center; margin-bottom: 30px; }
        .logo-icon { font-size: 48px; color: #7B1FA2; margin-bottom: 10px; }
        .logo-section h1 { color: #7B1FA2; font-size: 24px; margin-bottom: 5px; }
        .logo-section p { color: #777; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E1BEE7;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #9C27B0;
            box-shadow: 0 0 0 3px rgba(156, 39, 176, 0.15);
        }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 45px; }
        .eye-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9C27B0;
            font-size: 18px;
            cursor: pointer;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #7B1FA2, #9C27B0);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { 
            background: linear-gradient(135deg, #6A1B9A, #8E24AA);
            transform: translateY(-2px);
        }
        .aviso-texto {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-section">
            <i class="fas fa-shopping-cart logo-icon"></i>
            <h1>Mapa das Ofertas</h1>
            <p>Conecte sua conta de afiliado</p>
        </div>

        <div class="form-group">
            <label for="user-name">Seu Nome</label>
            <input type="text" id="user-name" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="app-id">App ID Shopee</label>
            <input type="text" id="app-id" placeholder="Cole seu App ID aqui">
        </div>

        <div class="form-group">
            <label for="app-secret">App Secret</label>
            <div class="password-wrapper">
                <input type="password" id="app-secret" placeholder="Sua chave secreta">
                <button type="button" id="toggle-secret" class="eye-btn">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="api-url">URL da API (opcional)</label>
            <input type="text" id="api-url" placeholder="https://open-api.shopee.com.br">
        </div>

        <button type="button" class="btn-primary" id="botao-entrar">
            <i class="fas fa-door-open"></i> Entrar
        </button>

        <p class="aviso-texto">
            🔒 Seus dados ficam salvos apenas no seu navegador.<br>
            Não enviamos para nenhum servidor externo.
        </p>
    </div>

    <script>
        function fazerLogin() {
            const nome = document.getElementById('user-name').value;
            const appId = document.getElementById('app-id').value;
            const appSecret = document.getElementById('app-secret').value;
            const apiUrl = document.getElementById('api-url').value;

            if (!nome || nome.trim() === '') {
                alert('⚠️ Por favor, digite seu nome!');
                return false;
            }

            localStorage.setItem('userName', nome);
            localStorage.setItem('appId', appId);
            localStorage.setItem('appSecret', appSecret);
            localStorage.setItem('apiUrl', apiUrl);

            window.location.href = 'dashboard.html';
            return true;
        }

        function configurarBotaoOlho() {
            const botaoOlho = document.getElementById('toggle-secret');
            if (!botaoOlho) return;
            
            botaoOlho.addEventListener('click', function() {
                const campo = document.getElementById('app-secret');
                const icone = botaoOlho.querySelector('i');
                if (campo.type === 'password') {
                    campo.type = 'text';
                    icone.className = 'fas fa-eye-slash';
                } else {
                    campo.type = 'password';
                    icone.className = 'fas fa-eye';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const botao = document.getElementById('botao-entrar');
            if (botao) {
                botao.addEventListener('click', fazerLogin);
            }
            configurarBotaoOlho();
        });
    </script>
</body>
</html>
