<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa das Ofertas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { 
            background: linear-gradient(135deg, #f57c00, #ff9800);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .entrada-box {
            background: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #f57c00; margin-bottom: 10px; font-size: 24px; }
        p { color: #666; margin-bottom: 30px; }
        .botao-ir {
            display: inline-block;
            background: #f57c00;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: 0.3s;
        }
        .botao-ir:hover { background: #e67000; }
        .icon { font-size: 48px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="entrada-box">
        <div class="icon">🛒</div>
        <h1>Mapa das Ofertas</h1>
        <p>Encontre. Compartilhe. Ganhe.</p>
        <a href="login.html" class="botao-ir">Acessar Sistema</a>
    </div>
</body>
</html>
