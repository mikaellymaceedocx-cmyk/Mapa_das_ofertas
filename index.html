<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar das Comissões — Entrar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-login">
    <div class="login-container">
        <div class="brand-section">
            <i class="fas fa-shopping-cart brand-icon"></i>
            <h1>Radar das Comissões</h1>
            <p>Encontre. Compartilhe. Ganhe.</p>
        </div>

        <div class="login-card">
            <h2>Entrar</h2>
            
            <div class="form-group">
                <label>Seu nome</label>
                <input type="text" id="user-name" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label>App ID</label>
                <input type="text" id="app-id" placeholder="Seu App ID">
            </div>

            <div class="form-group">
                <label>Secret</label>
                <div class="password-wrapper">
                    <input type="password" id="app-secret" placeholder="Sua chave secreta">
                    <button type="button" id="toggle-secret" class="eye-btn">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>URL da API</label>
                <input type="text" id="api-url" placeholder="https://...">
            </div>

            <button class="btn-primary" onclick="fazerLogin()">
                <i class="fas fa-door-open"></i> Entrar
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
