<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa das Ofertas</title>
<meta name="description" content="Mapa das Ofertas — encontre produtos com boas oportunidades para vender e ganhar comissões.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

:root{
  --roxo:#673AB7;
  --roxo2:#512DA8;
  --lilas:#F3E5F5;
  --fundo:#f5f5f7;
  --texto:#26222b;
  --muted:#77717d;
  --verde:#2e7d32;
  --vermelho:#c62828;
  --borda:#ece8ef;
}

body{
  background:var(--fundo);
  min-height:100vh;
  color:var(--texto);
}

button,input,select{font-family:inherit}
button{cursor:pointer}

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#29252d;
  color:#fff;
  padding:12px 20px;
  border-radius:10px;
  font-size:14px;
  z-index:9999;
  opacity:0;
  transition:.25s;
  max-width:90%;
  text-align:center;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

/* CABEÇALHO */
.top-bar{
  background:linear-gradient(135deg,var(--roxo2),var(--roxo));
  color:#fff;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:13px;
}
.top-bar strong{font-weight:800}
.logout-link{color:#fff;text-decoration:none}

header{
  background:linear-gradient(135deg,var(--roxo2),var(--roxo));
  color:#fff;
  padding:0 20px 20px;
}

.brand{
  font-size:22px;
  font-weight:800;
  margin:10px 0 6px;
}

.subtitle{
  font-size:14px;
  opacity:.94;
  margin-bottom:16px;
}

.search-container{
  display:flex;
  gap:10px;
}

.search-input{
  flex:1;
  padding:13px 16px;
  border:0;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

.search-btn{
  background:#fff;
  color:var(--roxo);
  border:0;
  width:52px;
  border-radius:10px;
  font-size:18px;
}

/* ABAS */
.category-tabs{
  background:var(--lilas);
  padding:12px 20px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}
.category-tabs::-webkit-scrollbar{display:none}

.cat-tab{
  white-space:nowrap;
  padding:10px 15px;
  border-radius:22px;
  font-size:14px;
  cursor:pointer;
  background:#fff;
  color:var(--roxo);
  border:2px solid transparent;
}
.cat-tab.active{
  background:var(--roxo);
  color:#fff;
  border-color:var(--roxo);
}

/* CONTEÚDO */
main{padding:20px}

.section-box{
  background:#fff;
  border-radius:14px;
  padding:17px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.035);
}

.section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:11px;
}

.select-box{
  width:100%;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  background:#f7f7f8;
  outline:none;
}

/* MODAL DE NICHOS */
.niche-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.42);
  display:none;
  z-index:5000;
}
.niche-modal.open{
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

.niche-sheet{
  width:min(680px,100%);
  height:min(88vh,760px);
  margin-top:5vh;
  background:#f7f9fc;
  border-radius:28px 28px 0 0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.niche-head{
  padding:18px 20px;
  border-bottom:1px solid #d9dde3;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
}

.niche-head h2{
  font-size:19px;
  color:#2b2630;
}

.niche-close{
  border:0;
  background:transparent;
  font-size:27px;
  color:#555;
}

.niche-list{overflow:auto}

.niche-option{
  width:100%;
  border:0;
  border-bottom:1px solid #d8dde3;
  background:#f7f9fc;
  padding:18px 22px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  font-size:16px;
  color:#202126;
}

.niche-option:hover{background:#eee9f7}

.radio{
  width:23px;
  height:23px;
  border:3px solid #555;
  border-radius:50%;
  flex:none;
}

.radio.selected{
  border-color:#673AB7;
  box-shadow:inset 0 0 0 5px #f7f9fc;
  background:#673AB7;
}

/* CABEÇALHO OFERTAS */
.offers-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  margin:21px 0 9px;
  padding-bottom:9px;
  border-bottom:3px solid var(--roxo);
}

.offers-title{
  font-size:20px;
  font-weight:800;
  color:var(--roxo);
  line-height:1.15;
}

.offers-count{
  font-size:13px;
  color:#8a858d;
  line-height:1.2;
  text-align:right;
}

.offers-count strong{
  font-size:16px;
  color:#5e5961;
}

/* FILTROS */
.filter-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:2px 0 11px;
}
.filter-row::-webkit-scrollbar{display:none}

.filter-chip{
  white-space:nowrap;
  background:#fff;
  border:1px solid #ddd4e4;
  color:#5c4c6d;
  border-radius:20px;
  padding:9px 12px;
  font-size:12px;
  font-weight:700;
}

.filter-chip.active{
  background:var(--lilas);
  border-color:var(--roxo);
  color:var(--roxo2);
}

.sort-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:5px 0 17px;
}

.sort-label{
  font-size:13px;
  color:#777;
  white-space:nowrap;
}

.sort-select{
  flex:1;
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  color:#4b4650;
}

/* CARDS */
.products-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.product-card{
  background:#fff;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  border:1px solid #eee;
  transition:.2s;
}

.product-card:hover{
  transform:translateY(-2px);
  box-shadow:0 7px 20px rgba(81,45,168,.12);
}

.product-image{
  width:100%;
  height:150px;
  position:relative;
  background:#eee;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.commission-badge{
  position:absolute;
  left:8px;
  bottom:8px;
  background:var(--roxo);
  color:#fff;
  padding:5px 8px;
  font-size:11px;
  font-weight:800;
  border-radius:5px;
}

.extra-badge{
  position:absolute;
  right:8px;
  top:8px;
  background:#8E24AA;
  color:#fff;
  font-size:10px;
  padding:5px 7px;
  border-radius:5px;
  font-weight:800;
}

.discount-badge{
  position:absolute;
  left:8px;
  top:8px;
  background:#c62828;
  color:#fff;
  font-size:10px;
  padding:5px 7px;
  border-radius:5px;
  font-weight:800;
}

.product-info{
  padding:11px;
}

.product-name{
  font-size:14px;
  color:#302c34;
  line-height:1.35;
  margin-bottom:5px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:38px;
}

.product-store{
  font-size:11px;
  color:#817b84;
  margin-bottom:7px;
}

.product-price{
  font-size:18px;
  font-weight:800;
  color:#242027;
  margin-bottom:6px;
}

.old-price{
  font-size:11px;
  color:#999;
  text-decoration:line-through;
  margin-right:5px;
}

.product-meta{
  font-size:11px;
  color:#6e6871;
  display:flex;
  justify-content:space-between;
  gap:5px;
  margin-bottom:7px;
}

.earnings{
  background:var(--lilas);
  color:var(--roxo2);
  padding:7px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
  margin-bottom:8px;
}

.opportunity{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px;
  padding:7px 8px;
  border-radius:6px;
  background:#f7f7f8;
  font-size:10px;
  color:#5f5963;
}

.opportunity strong{color:var(--verde)}

.btn-create{
  width:100%;
  padding:10px;
  background:var(--roxo);
  color:#fff;
  border:0;
  border-radius:7px;
  font-size:12px;
  font-weight:800;
}

.btn-create:hover{background:var(--roxo2)}

.no-results{
  grid-column:1/-1;
  background:#fff;
  border-radius:12px;
  padding:35px 20px;
  text-align:center;
  color:#777;
}

.empty-icon{
  font-size:34px;
  margin-bottom:10px;
}

@media(max-width:360px){
  .products-grid{grid-template-columns:1fr}
  .product-image{height:180px}
}
</style>
</head>

<main>

  </div>

  <div class="filter-row">

    <button class="filter-chip" data-filter="vendidos" onclick="setFiltro('vendidos')">

    <button class="filter-chip" data-filter="extra" onclick="setFiltro('extra')">

    </button>

    <button class="filter-chip" data-filter="ofertas" onclick="setFiltro('ofertas')">
      🏷️ Ofertas

  </div>

  <div class="sort-row">
    <span class="sort-label">Ordenar por</span>

    <select id="sortSelect" class="sort-select" onchange="renderizar()">
      <option value="comissao">Maior comissão (R$)</option>
      <option value="preco">Menor preço</option>
      <option value="vendidos">Mais vendidos</option>
      <option value="afiliados">Menos afiliados</option>
    </select>
  </div>

  <div class="products-grid" id="produtos-container"></div>

</main>

<!-- MODAL DE NICHOS -->
<div

        aria-label="Fechar"

  </div>
</div>

let filtroAtual = "todos";
let nichoAtual = "Todos os nichos";

function mostrarMsg(texto){
  const t = document.getElementById("toast");

  t.textContent = texto;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    t.classList.remove("show");
  }, 2300);
}

function setFiltro(filtro){
  filtroAtual = filtro;

  document.querySelectorAll(".cat-tab,.filter-chip").forEach(el => {
    el.classList.toggle("active", el.dataset.filter === filtro);
  });

  renderizar();
}

function abrirNichos(){
  const list = document.getElementById("nicheList");

  list.innerHTML = nichos.map(n => `
    <button
      class="niche-option"
      onclick="selecionarNicho(${JSON.stringify(n)})"
    >
      <span>${n}</span>
      <span class="radio ${n === nichoAtual ? "selected" : ""}"></span>
    </button>
  `).join("");

  document.getElementById("nicheModal").classList.add("open");
}

function fecharNichos(){
  document.getElementById("nicheModal").classList.remove("open");
}

function selecionarNicho(nicho){
  nichoAtual = nicho;

  document.getElementById("selectedNiche").textContent = nicho;

  fecharNichos();
  renderizar();
}

function formatarMoeda(valor){
  return valor.toFixed(2).replace(".",",");
}

function renderizar(){

  const busca = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  let lista = produtos.filter(p => {

    const texto = (
      p.nome + " " +
      p.loja + " " +
      p.nicho
    ).toLowerCase();

    const bateBusca =
      !busca || texto.includes(busca);

    const bateNicho =
      nichoAtual === "Todos os nichos" ||
      p.nicho === nichoAtual;

    return bateBusca && bateNicho;
  });

  if(filtroAtual === "poucos"){
    lista = lista.filter(p => p.afiliados <= 10);
  }

  if(filtroAtual === "vendidos"){
    lista = lista.filter(p => p.vendidos >= 200);
  }

  if(filtroAtual === "extra"){
    lista = lista.filter(p => p.comissaoExtra);
  }

  if(filtroAtual === "ofertas"){
    lista = lista.filter(p =>
      p.desconto ||
      p.preco <= 100 ||
      p.comissao >= 18
    );
  }

  const ordenacao =
    document.getElementById("sortSelect").value;

  if(ordenacao === "comissao"){
    lista.sort((a,b) => b.ganho - a.ganho);
  }

  if(ordenacao === "preco"){
    lista.sort((a,b) => a.preco - b.preco);
  }

  if(ordenacao === "vendidos"){
    lista.sort((a,b) => b.vendidos - a.vendidos);
  }

  if(ordenacao === "afiliados"){
    lista.sort((a,b) => a.afiliados - b.afiliados);
  }

  document.getElementById("offersCount").textContent = lista.length;

  const container =
    document.getElementById("produtos-container");

  if(!lista.length){

    container.innerHTML = `
      <div class="no-results">
        <div class="empty-icon">🔎</div>
        <strong>Nenhuma oferta encontrada.</strong>
        <br>
        Tente outro nicho ou filtro.
      </div>
    `;

    return;
  }

  container.innerHTML = lista.map(p => {

    const desconto = p.desconto
      ? `<span style="color:#C62828;font-size:12px">-${p.desconto}%</span>`
      : "";

    const extra = p.comissaoExtra
      ? `<span class="extra-badge">COMISSÃO EXTRA</span>`
      : "";

    const descontoBadge = p.desconto
      ? `<span class="discount-badge">${p.desconto}% OFF</span>`
      : "";

    return `
      <article class="product-card">

        <div class="product-image">

          ${extra}
          ${descontoBadge}

          <img
            src="${p.imagem}"
            alt="${p.nome}"
            loading="lazy"
            onerror="this.src='https://via.placeholder.com/600x400?text=Oferta'"
          >

          <span class="commission-badge">
            Comissão ${p.comissao}%
          </span>

        </div>

        <div class="product-info">

          <h3 class="product-name">
            ${p.nome}
          </h3>

          <p class="product-store">
            ${p.loja}
          </p>

          <p class="product-price">
            ${p.desconto ? `<span class="old-price">R$ ${(p.preco * (1 + p.desconto/100)).toFixed(2).replace(".",",")}</span>` : ""}
            R$ ${formatarMoeda(p.preco)}
            ${desconto}
          </p>

          <div class="product-meta">
            <span>⭐ ${p.avaliacao}</span>
            <span>${p.vendidos.toLocaleString("pt-BR")} vendidos</span>
          </div>

          <div class="product-meta">
            <span>🌱 ${p.afiliados} afiliados</span>
            <span>${p.nicho}</span>
          </div>

          <div class="earnings">
            Você ganha ~R$ ${formatarMoeda(p.ganho)}
          </div>

          <div class="opportunity">
            <span>Oportunidade</span>
            <strong>${calcularOportunidade(p)} / 100</strong>
          </div>

          <button
            class="btn-create"
            onclick="criarOferta(${p.id})"
          >
            CRIAR OFERTA
          </button>

        </div>
      </article>
    `;
  }).join("");
}

function calcularOportunidade(p){

  let score = 0;

  /* Menos afiliados = maior oportunidade */
  if(p.afiliados <= 5) score += 35;
  else if(p.afiliados <= 10) score += 28;
  else if(p.afiliados <= 20) score += 18;
  else score += 8;

  /* Comissão */
  if(p.comissao >= 20) score += 25;
  else if(p.comissao >= 16) score += 20;
  else if(p.comissao >= 13) score += 15;
  else score += 10;

  /* Procura */
  if(p.vendidos >= 1000) score += 20;
  else if(p.vendidos >= 500) score += 17;
  else if(p.vendidos >= 200) score += 13;
  else if(p.vendidos >= 100) score += 9;
  else score += 5;

  /* Extra/desconto */
  if(p.comissaoExtra) score += 10;
  if(p.desconto) score += 10;

  return Math.min(100, score);
}

function criarOferta(id){

  const produto = produtos.find(p => p.id === id);

  if(!produto){
    mostrarMsg("Oferta não encontrada.");
    return;
  }

  /*
    Quando o link real de afiliado for cadastrado,
    o botão abre a oferta em nova aba.
  */
  if(produto.link && produto.link.trim() !== ""){
    window.open(produto.link, "_blank", "noopener,noreferrer");
    return;
  }

  mostrarMsg(
    "Oferta selecionada: " +
    produto.nome +
    " — adicione o link real de afiliado no campo link."
  );
}

document.addEventListener("keydown", function(event){
  if(event.key === "Escape"){
    fecharNichos();
  }
});

renderizar();
</script>
