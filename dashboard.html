<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa das Ofertas — Painel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f8f0fc; min-height: 100vh; }
        header {
            background: linear-gradient(135deg, #7B1FA2, #9C27B0);
            color: white;
            padding: 20px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar {
            width: 40px; height: 40px;
            background: white; color: #7B1FA2;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px;
        }
        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none; color: white;
            padding: 8px 15px; border-radius: 6px;
            cursor: pointer; font-size: 14px;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }
        h1 { font-size: 22px; margin-bottom: 5px; }
        .slogan { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }
        .search-box {
            width: 100%; padding: 12px 15px;
            border: none; border-radius: 8px;
            font-size: 15px;
            background: white;
        }
        nav {
            background: white;
            padding: 15px 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tab-btn {
            padding: 10px 18px;
            border: none; border-radius: 20px;
            background: #f3e5f5; color: #7B1FA2;
            font-size: 14px; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #7B1FA2, #9C27B0);
            color: white;
        }
        main { padding: 20px; }
        .section-title {
            font-size: 18px; color: #4A148C;
            margin-bottom: 15px; font-weight: 600;
        }
        .filter-bar {
            background: white;
            padding: 15px; border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .filter-bar p {
            font-size: 14px; color: #666; margin-bottom: 10px;
        }
        .filter-row {
            display: flex; gap: 8px; flex-wrap: wrap;
        }
        .filter-tag {
            padding: 6px 12px; border-radius: 15px;
            background: #f3e5f5; color: #7B1FA2;
            font-size: 13px; cursor: pointer; margin-bottom: 5px;
        }
        .filter-tag.active {
            background: #7B1FA2; color: white;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white; border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 8px rgba(123, 31, 162, 0.08);
        }
        .product-img {
            width: 100%; height: 180px;
            background: #f3e5f5; display: flex;
            align-items: center; justify-content: center;
            font-size: 40px; color: #CE93D8;
        }
        .product-info { padding: 15px; }
        .product-name {
            font-size: 15px; color: #333;
            margin-bottom: 8px; line-height: 1.4;
        }
        .product-price {
            font-size: 18px; font-weight: bold;
            color: #7B1FA2; margin-bottom: 5px;
        }
        .product-commission {
            font-size: 13px; color: #9C27B0;
            margin-bottom: 12px;
        }
        .create-btn {
            width: 100%; padding: 10px;
            background: linear-gradient(135deg, #7B1FA2, #9C27B0);
            color: white; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer;
            font-size: 14px;
        }
        .create-btn:hover { opacity: 0.95; }
        .welcome-name {
            font-size: 15px; margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="user-info">
                <div class="user-avatar" id="user-initial">U</div>
                <div>
                    <p class="welcome-name">Bem-vindo, <span id="display-name">Usuário</span>!</p>
                </div>
            </div>
            <button class="logout-btn" onclick="sairDoSistema()">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
        <h1>🛒 Mapa das Ofertas</h1>
        <p class="slogan">Encontre produtos com poucos afiliados divulgando</p>
        <input type="text" class="search-box" placeholder="🔍 Buscar produto por nome ou nicho...">
    </header>

    <nav>
        <button class="tab-btn active">Ofertas do Dia</button>
        <button class="tab-btn">⭐ Bem Avaliados</button>
        <button class="tab-btn">🛒 Mais Vendidos</button>
        <button class="tab-btn">👤 Poucos Afiliados</button>
        <button class="tab-btn">💰 Maior Comissão</button>
    </nav>

    <main>
        <h2 class="section-title">OFERTAS DISPONÍVEIS</h2>

        <div class="filter-bar">
            <p>Filtrar por nicho:</p>
            <div class="filter-row">
                <span class="filter-tag active">Todos</span>
                <span class="filter-tag">🍼 Bebês</span>
                <span class="filter-tag">🏠 Casa</span>
                <span class="filter-tag">💄 Beleza</span>
                <span class="filter-tag">👗 Moda</span>
                <span class="filter-tag">📱 Tecnologia</span>
            </div>
        </div>

        <div class="products-grid" id="lista-produtos">
            <!-- Produtos vão aparecer aqui -->
        </div>
    </main>

    <script>
        // 👤 Carregar nome do usuário
        const nomeSalvo = localStorage.getItem('userName') || 'Usuário';
        document.getElementById('display-name').textContent = nomeSalvo;
        document.getElementById('user-initial').textContent = nomeSalvo.charAt(0).toUpperCase();

        // 🚪 Sair do sistema
        function sairDoSistema() {
            if (confirm('Tem certeza que deseja sair?')) {
                localStorage.removeItem('userName');
                window.location.href = 'login.html';
            }
        }

        // 📦 Produtos de exemplo
        const produtos = [
            { nome: 'Kit Cadeirinha de Alimentação Bebê', preco: 'R$ 189,90', comissao: '13%', ganho: '~R$ 24,69', icone: '🪑', nicho: 'bebes' },
            { nome: 'Organizador de Gavetas 4 Peças', preco: 'R$ 45,90', comissao: '15%', ganho: '~R$ 6,89', icone: '🗄️', nicho: 'casa' },
            { nome: 'Creme Hidratante Corporal', preco: 'R$ 35,90', comissao: '12%', ganho: '~R$ 4,31', icone: '🧴', nicho: 'beleza' },
            { nome: 'Conjunto Blusa + Calça Infantil', preco: 'R$ 69,90', comissao: '14%', ganho: '~R$ 9,79', icone: '👕', nicho: 'bebes' },
            { nome: 'Suporte para Celular de Mesa', preco: 'R$ 29,90', comissao: '18%', ganho: '~R$ 5,38', icone: '📲', nicho: 'tecnologia' },
            { nome: 'Jogo de Toalhas de Banho 5 Peças', preco: 'R$ 79,90', comissao: '11%', ganho: '~R$ 8,79', icone: '🛁', nicho: 'casa' }
        ];

        // 🎯 Renderizar produtos
        function carregarProdutos(lista = produtos) {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = '';
            
            lista.forEach(produto => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-img">${produto.icone}</div>
                    <div class="product-info">
                        <h3 class="product-name">${produto.nome}</h3>
                        <p class="product-price">${produto.preco}</p>
                        <p class="product-commission">Comissão ${produto.comissao} • Você ganha ${produto.ganho}</p>
                        <button class="create-btn">✨ Criar Oferta</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 🔄 Carregar ao abrir a página
        document.addEventListener('DOMContentLoaded', function() {
            carregarProdutos();
        });
    </script>
</body>
</html>
